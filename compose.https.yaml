name: scout-table
services:
  scout:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env first}
      MAX_ROOMS: ${MAX_ROOMS:-200}
    volumes:
      - scout-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      scout:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  scout-data:
  caddy-data:
  caddy-config:
